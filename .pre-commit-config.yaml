repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # GitHub Actions and agents prompts use YAML tags / constructors PyYAML treats as "unsafe"
      # (not arbitrary code—just non-standard schema). Safe mode fails on those files; --unsafe
      # still catches syntax errors while allowing those constructs.
      - id: check-yaml
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/arkinmodi/add-license-header
    rev: v2.4.1
    hooks:
      - id: add-license-header
        types_or: [python, shell, ts]
        args:
          - --license
          - |
            SPDX-FileCopyrightText: 2026 Ting-An Cheng
            SPDX-License-Identifier: MIT

  # Keep rev aligned with ruff in uv.lock / pyproject tooling (same linter behavior locally vs hooks).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-cjk-in-source-and-docs
        name: disallow CJK in source and docs
        description: >-
          Block Han/Hangul-related scripts in code, prompts, and docs (English only;
          see AGENTS.md). Does not scan lockfiles or sample/ trees.
        language: pygrep
        # UTF-8 bytes for CJK Unified (U+4E00–U+9FFF); pygrep matches binary lines.
        entry: '[\xe4-\xe9][\x80-\xbf][\x80-\xbf]'
        types_or: [python, shell, ts, markdown, yaml, toml]
        files: ^(src/|tests/|tools/|scripts/|agents/|skills/|docs/|\.github/|README\.md|CHANGELOG\.md|ROADMAP\.md|AGENTS\.md|mkdocs\.yml|pyproject\.toml)
        exclude: ^(sample/|_build/|\.venv/)
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
        args: ["."]
