[project]
name = "dv-agentic-system"
version = "0.1.0"
description = "Core AI Agent System for UVM/pyuvm Verification"
authors = [{name = "Ting-An Cheng"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cocotb>=1.8.0",
    "pyuvm>=0.0.10",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
dv-agentic = "dv_agentic.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dv_agentic"]
include = [
    "src/dv_agentic/prompts/*.md",
    "src/dv_agentic/profiles/_template/*.yaml"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["cocotb.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]

ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is expected in pytest

[tool.ruff.lint.isort]
known-first-party = ["dv_agentic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
