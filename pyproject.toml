[project]
name = "dv-agentic-system"
version = "0.8.1"
description = "Core AI Agent System for UVM/pyuvm Verification"
authors = [{name = "Ting-An Cheng"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
cocotb = [
    "cocotb>=1.8.0",
    "pyuvm>=0.0.10",
]

# BM25 search (pure Python, air-gapped compatible)
# Install with: pip install "dv-agentic-system[wiki]"
# For air-gapped RHEL 8.4: pip install "bm25s[core]" --no-index --find-links dv_wheels/
wiki = [
    "bm25s[core]>=0.2.0",
]

[project.scripts]
dv-agentic    = "dv_agentic.main:main"
dv-docs       = "dv_agentic.docs:build"
wiki-build    = "dv_agentic.cli.wiki_build:main"
wiki-lint     = "dv_agentic.cli.wiki_lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=4.6.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.23.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dv_agentic"]
include = [
    "src/dv_agentic/prompts/*.md",
    "src/dv_agentic/profiles/_template/*.yaml",
]

[tool.pytest.ini_options]
testpaths  = ["tests"]
addopts    = "--tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["cocotb.*", "bm25s.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
]

ignore = [
    "D100",
    "D104",
    "S101",
    "ARG",
]

[tool.ruff.lint.per-file-ignores]
"src/dv_agentic/cli/wiki_search.py" = ["T201"]   # print() is intentional in CLI

[tool.ruff.lint.isort]
known-first-party = ["dv_agentic"]

[tool.ruff.format]
quote-style             = "double"
indent-style            = "space"
skip-magic-trailing-comma = false
line-ending             = "auto"
